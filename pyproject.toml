[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eukcontigminer"
version = "0.50"
description = "Single-device DNA and protein-language-model screening of eukaryotic contigs"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [{name = "WeStrainGroup"}]
dependencies = [
  "esm==3.2.1",
  "numpy>=1.26,<3",
  "torch>=2.2,<2.6",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
eukcontigminer = "eukcontigminer.cli:main"

[project.urls]
Repository = "https://github.com/WeStrainGroup/EukContigMiner"

[tool.setuptools.packages.find]
include = ["eukcontigminer*"]

[tool.setuptools.package-data]
eukcontigminer = ["model_data/*.json", "model_data/*.pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
