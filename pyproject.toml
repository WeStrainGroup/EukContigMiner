[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eukcontigminer"
version = "0.84.1"
description = "Independent eukaryotic and fungal contig classification"
requires-python = ">=3.11,<3.13"
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "NTV3-MODEL-LICENSE.md"]
authors = [{name = "WeStrainGroup"}]
dependencies = ["torch==2.13.0", "numpy==2.4.6", "scipy==1.17.1", "transformers==4.48.1", "safetensors==0.8.0", "esm==3.2.1", "einops==0.8.2", "huggingface-hub==0.36.2", "packaging>=24"]

[project.scripts]
eukcontigminer = "eukcontigminer.cli:main"

[project.urls]
Repository = "https://github.com/WeStrainGroup/EukContigMiner"

[tool.setuptools.packages.find]
include = ["eukcontigminer*"]

[tool.setuptools.package-data]
eukcontigminer = ["release.json", "assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
